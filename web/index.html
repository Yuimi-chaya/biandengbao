<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/enhancements.css"><link rel="stylesheet" href="/chat.css"><link rel="stylesheet" href="/workspace.css"><title>便蹬宝 · Codex 手机网关</title></head>
<body>
<script src="/settings.js" defer></script>
<script src="/thread-ui.js" defer></script>
<script src="/reading.js" defer></script>
<script src="/connection.js" defer></script>
<dialog id="stop-dialog" class="picker stop-dialog">
  <div class="picker-head"><h2>停止当前任务？</h2><button type="button" class="icon-button" data-close="stop-dialog" aria-label="关闭停止确认">×</button></div>
  <p id="stop-thread" class="compact-thread"></p>
  <p>任务将中断，已经完成的操作不会撤销。</p>
  <p id="stop-error" class="error" role="alert"></p>
  <div class="stop-actions"><button type="button" class="secondary" data-close="stop-dialog">继续工作</button><button type="button" id="stop-confirm" class="danger">确认停止</button></div>
</dialog>
<section id="login" class="login" hidden>
  <div class="wordmark"><span class="mark">⌘</span> 便蹬宝 <span class="light">/ CODEX</span></div>
  <div class="login-card"><div class="eyebrow">继续电脑上的工作</div><h1>连接你的 Codex</h1><p class="muted">聊天、查看进度，以及处理待确认的操作。</p>
  <form id="login-form"><div id="credentials"><label>账号<input id="username" name="username" autocomplete="username" required value="admin"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" required></label></div><p id="noauth" class="muted" hidden>此网关已启用免密访问。</p><button type="submit" class="primary" id="login-button">连接电脑 <span>↗</span></button><p id="login-error" role="alert" class="error"></p></form></div><div class="login-foot">任务在电脑运行 · 沿用桌面模型设置</div>
</section>
<div id="app" class="app" hidden>
  <aside id="sidebar"><header class="sidebar-head"><div class="wordmark"><span class="mark">⌘</span> 便蹬宝 <span class="light">/ CODEX</span></div><button id="refresh" class="icon-button" aria-label="刷新聊天列表">↻</button></header><div class="list-heading"><h2>工作区</h2><label class="archive"><input id="archived" type="checkbox"> 已归档</label></div><input id="search" class="search" placeholder="搜索线程或项目" aria-label="搜索线程或项目"><label class="list-mode">查看<select id="list-mode" aria-label="聊天列表显示方式"><option value="recent">最近交互</option><option value="project">按项目</option></select></label><p id="host-errors" class="error host-errors" hidden></p><div id="sessions" class="sessions"></div><button id="more" class="plain" hidden>加载更多</button><footer class="sidebar-foot"><span>本机与 SSH 会话</span><button id="logout" class="plain">退出登录</button></footer></aside>
  <main id="main"><div id="welcome" class="welcome"><div class="mark large">⌘</div><h1>从一条聊天继续</h1><p class="muted">选择电脑上的聊天，查看进度或发送消息。</p></div>
  <section id="chat" class="chat" hidden><header class="chat-head"><button id="back" class="icon-button" aria-label="返回聊天列表">‹</button><div class="chat-info"><h1 id="chat-title"></h1><div id="chat-meta" class="muted"></div></div><span id="status" class="status"></span></header>
  <div id="notice" class="notice" hidden><span id="notice-text"></span><button id="reconnect" class="plain">重新连接</button></div>
  <div id="timeline" class="timeline"><button id="history" class="plain history" hidden>加载完整历史</button><div id="messages"></div><div id="approvals"></div><div id="queued"></div><div id="working" class="working" hidden><i></i> Codex 正在工作…</div></div>
  <form id="composer" class="composer"><div class="composer-tools"><button id="model-button" class="tool-button" type="button">模型</button><button id="skills-button" class="tool-button" type="button">Skill <span id="skill-count"></span></button></div><div id="skill-pills" class="skill-pills"></div><div id="send-error" class="error" role="alert"></div><textarea id="message" rows="3" placeholder="继续这条聊天…" aria-label="消息内容" maxlength="100000"></textarea><div class="compose-bottom"><select id="send-mode" aria-label="发送方式"><option value="send">发送新消息</option><option value="queue">完成后发送</option><option value="steer">补充当前任务</option></select><div class="compose-actions"><button id="stop" class="stop" type="button" hidden>■ 停止</button><button id="send" type="submit" class="primary">发送 ↑</button></div></div><div class="compose-foot"><span id="execution-host">在本机运行</span> <span id="provider"></span></div></form></section></main>
</div><div id="toast" class="toast" role="status" hidden></div><dialog id="model-dialog" class="picker"><div class="picker-head"><h2>模型与推理强度</h2><button class="icon-button" data-close="model-dialog" aria-label="关闭模型设置">×</button></div><p class="muted">应用到当前聊天，正在运行的任务从下一轮使用。</p><form id="model-form"><label>模型<select id="model-select" required></select></label><label id="custom-model-label" hidden>自定义模型 ID<input id="custom-model" placeholder="输入当前 API 服务支持的模型 ID" maxlength="200"></label><label>推理强度<select id="effort-select" required></select></label><p id="model-description" class="muted"></p><p id="model-error" class="error" role="alert"></p><button id="model-save" class="primary" type="submit">应用到此聊天</button></form></dialog>
<dialog id="skills-dialog" class="picker"><div class="picker-head"><h2>选择 Skill</h2><button class="icon-button" data-close="skills-dialog" aria-label="关闭 Skill 选择">×</button></div><p class="muted">选择后随下一条消息一起发送，最多 8 个。</p><input id="skill-search" placeholder="搜索已安装 Skill" aria-label="搜索已安装 Skill"><div id="skill-list" class="skill-list"></div><p id="skills-error" class="error" role="alert"></p><div class="picker-actions"><button id="skills-refresh" class="plain" type="button">刷新列表</button><button class="primary" data-close="skills-dialog" type="button">完成</button></div></dialog><script src="/vendor/marked.js" defer></script><script src="/vendor/purify.js" defer></script><script src="/vendor/highlight.js" defer></script><script src="/vendor/lucide.js" defer></script><script src="/enhancements.js" defer></script><script src="/app.js" defer></script></body></html>
